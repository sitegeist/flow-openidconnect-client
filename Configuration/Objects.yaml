Flownative\OpenIdConnect\Client\OpenIdConnectClient:
  properties:
    discoveryCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Flownative_OpenIdConnect_Client_Discovery
    jwksCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Flownative_OpenIdConnect_Client_JWKs

Flownative\OpenIdConnect\Client\OAuthClient:
  properties:
    stateCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Flownative_OAuth2_Client_State

Flownative\OpenIdConnect\Client\Http\SetJwtCookieMiddleware:
  arguments:
    1:
      setting: 'Flownative.OpenIdConnect.Client.middleware'
    2:
      setting: 'Neos.Flow.security.authentication.providers'

Flownative\OpenIdConnect\Client\BackChannelLogout\AuthenticationRevocationRegistry:
  arguments:
    1:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Flownative_OpenIdConnect_Client_AuthenticationRevocations
    2:
      setting: Flownative.OpenIdConnect.Client.authenticationRevocation.lifetime

Flownative\OpenIdConnect\Client\TokenExchange\IdentityTokenRegistry:
  arguments:
    1:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: Flownative_OpenIdConnect_Client_IdentityTokens

