Neos:
  Flow:
    http:
      middlewares:
        'Flownative.OpenIdConnect.Client:setJwtCookie':
          position: 'after session'
          middleware: 'Flownative\OpenIdConnect\Client\Http\SetJwtCookieMiddleware'
        'Flownative.OpenIdConnect.Client:backChannelLogout':
          position: 'before routing'
          middleware: 'Flownative\OpenIdConnect\Client\Http\BackChannelLogoutMiddleware'
